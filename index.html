<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Achoo</title>
<meta name="description" content="Achoo: 킬링타임용 예쁜 쓰레기. 손가락 하나로 노는 귀여운 장난감 상자.">
<meta name="theme-color" content="#ffd6e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#ffd6e8;--ink:#4a2b5a;
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
    --ease-out:cubic-bezier(0,0,.2,1);   /* enter / user-triggered (omd-feel) */
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--field)}
  body{color:var(--ink);font-family:'Chivo',system-ui,sans-serif;font-weight:900;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease-out)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #steps{position:fixed;top:calc(var(--safe-t) + 14px);left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3;pointer-events:none}
  #steps i{display:block;width:12px;height:12px;border-radius:50%;outline:2px solid var(--ink);outline-offset:-2px;transition:background-color .2s var(--ease-out),transform .2s var(--ease-out)}
  #steps i.done{background:var(--ink)}
  #steps i.now{background:var(--ink);transform:scale(1.5)}
  #bar{position:fixed;left:0;right:0;bottom:0;height:calc(12px + var(--safe-b));padding-bottom:var(--safe-b);z-index:3;pointer-events:none}
  #bar b{display:block;height:12px;border-radius:0 6px 6px 0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .2s var(--ease-out)}
  #title{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 7vh);z-index:2;display:none;pointer-events:none;text-align:center}
  #title h1{font-size:min(28vw,230px);line-height:.88;letter-spacing:-.05em;text-transform:uppercase;font-weight:900}
  body.title #title{display:block}
  .corner{all:unset;box-sizing:border-box;position:fixed;bottom:calc(26px + var(--safe-b));width:64px;height:64px;display:none;place-items:center;cursor:pointer;z-index:4}
  body.title .corner{display:grid}
  #book{left:calc(50% + 8px)}
  #book i{display:block;width:34px;height:42px;border:3px solid var(--ink);border-radius:8px;background:var(--field);box-shadow:5px -5px 0 -2px var(--ink)}
  #door{left:calc(50% - 72px)}
  #door i{display:block;width:30px;height:42px;border:3px solid var(--ink);border-radius:15px 15px 3px 3px;position:relative}
  #door i::after{content:"";position:absolute;right:5px;top:22px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
  .corner:focus-visible{outline:3px solid var(--ink);outline-offset:-4px}
  #burst{position:fixed;inset:0;pointer-events:none;background:var(--next);clip-path:circle(0 at var(--bx) var(--by));z-index:5}
  #burst.go{animation:burst .45s var(--ease-out) forwards}
  @keyframes burst{to{clip-path:circle(150vmax at var(--bx) var(--by))}}
  @media(prefers-reduced-motion:reduce){body,#steps i,#bar b{transition:none}#burst.go{animation:none;opacity:0}}
</style>
</head>
<body class="title">
<canvas id="c" aria-label="장난감 캔버스"></canvas>
<div id="title"><h1>Achoo</h1></div>
<div id="steps" aria-hidden="true"></div>
<div id="bar"><b id="fill"></b></div>
<button id="book" class="corner" aria-label="스티커북"><i></i></button>
<a id="door" class="corner" href="escape.html" aria-label="방탈출"><i></i></a>
<div id="burst"></div>
<script src="toy.js"></script>
<script>boot()</script>
</body>
</html>
