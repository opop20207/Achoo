<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Achoo</title>
<meta name="description" content="Achoo: 말이 없는 방탈출. 문을 닫은 병원에서 눈을 뜬다.">
<meta name="theme-color" content="#2436ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#2436ff;--ink:#ffffff;
    --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
    --ease-out:cubic-bezier(0,0,.2,1);   /* enter / user-triggered (omd-feel) */
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--field)}
  body{color:var(--ink);font-family:'Chivo',system-ui,sans-serif;font-weight:900;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease-out)}
  body.inv{filter:invert(1);transition:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:opacity .4s var(--ease-out)}
  canvas.hide{opacity:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #steps{position:fixed;top:calc(var(--safe-t) + 14px);left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3;pointer-events:none}
  #steps i{display:block;width:12px;height:12px;outline:2px solid var(--ink);outline-offset:-2px;transition:background-color .2s var(--ease-out),transform .2s var(--ease-out)}
  #steps i.done{background:var(--ink)}
  #steps i.now{background:var(--ink);transform:scale(1.5)}
  #steps i.sec::after{content:"";display:block;width:4px;height:4px;margin:4px;background:var(--field)}
  #bar{position:fixed;left:0;right:0;bottom:0;height:calc(12px + var(--safe-b));padding-bottom:var(--safe-b);z-index:3;pointer-events:none}
  #bar b{display:block;height:12px;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .2s var(--ease-out)}
  #title{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 8vh);z-index:2;display:none;pointer-events:none;text-align:center}
  #title h1{font-size:min(28vw,230px);line-height:.88;letter-spacing:-.05em;text-transform:uppercase;font-weight:900}
  body.title #title{display:block}
  #arch{all:unset;box-sizing:border-box;position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%);width:64px;height:64px;display:none;place-items:center;cursor:pointer;z-index:4}
  body.title #arch{display:grid}
  #arch i{display:block;width:40px;height:24px;border:3px solid var(--ink);border-radius:50%/60%;position:relative}
  #arch i::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ink)}
  #arch:focus-visible{outline:3px solid var(--ink);outline-offset:-4px}
  #back{all:unset;box-sizing:border-box;position:fixed;left:6px;top:calc(var(--safe-t) + 6px);width:48px;height:48px;display:none;place-items:center;cursor:pointer;z-index:4}
  body.puz #back{display:grid}
  #back i{display:block;width:16px;height:16px;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:translateX(3px) rotate(45deg)}
  #back.nudge i{animation:nudge .5s ease-in-out infinite alternate}
  @keyframes nudge{to{transform:translateX(-3px) rotate(45deg) scale(1.35)}}
  #back:focus-visible{outline:3px solid var(--ink);outline-offset:-4px}
  #burst{position:fixed;inset:0;pointer-events:none;background:var(--next);clip-path:circle(0 at var(--bx) var(--by));z-index:5}
  #burst.go{animation:burst .45s var(--ease-out) forwards}
  @keyframes burst{to{clip-path:circle(150vmax at var(--bx) var(--by))}}
  @media(prefers-reduced-motion:reduce){body,#steps i,#bar b,canvas{transition:none}#burst.go{animation:none;opacity:0}#back.nudge i{animation:none}}
</style>
</head>
<body class="title">
<canvas id="c" aria-label="장난감 캔버스"></canvas>
<div id="title"><h1>Achoo</h1></div>
<div id="steps" aria-hidden="true"></div>
<div id="bar"><b id="fill"></b></div>
<button id="arch" aria-label="기록"><i></i></button>
<button id="back" aria-label="방으로 돌아가기"><i></i></button>
<div id="burst"></div>
<script src="escape-engine.js"></script>
<script src="escape-rooms.js"></script>
<script>boot()</script>
</body>
</html>
